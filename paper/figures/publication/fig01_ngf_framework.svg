    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #202b36" x="262.08" y="38.452344" transform="rotate(-0 262.08 38.452344)">Numerical Grounding Framework (NGF)</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007a87" x="25.9056" y="86.562516" transform="rotate(-0 25.9056 86.562516)">Representational grounding (RG)</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #202b36" transform="translate(25.9056 102.168775)">Surface form → value, magnitude, order</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #202b36" transform="translate(25.9056 112.806697)">and equivalent formats</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b65f22" x="286.6176" y="86.562516" transform="rotate(-0 286.6176 86.562516)">Procedural grounding (PG)</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #202b36" transform="translate(286.6176 102.168775)">Faithful arithmetic procedures</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #202b36" transform="translate(286.6176 112.806697)">and generalization to longer operands</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007a87" x="25.9056" y="167.706516" transform="rotate(-0 25.9056 167.706516)">FAILURES</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #202b36" transform="translate(25.9056 183.312775)">Tokenization and segmentation artifacts;</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #202b36" transform="translate(25.9056 193.950697)">format and unit equivalence</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b65f22" x="286.6176" y="167.706516" transform="rotate(-0 286.6176 167.706516)">FAILURES</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #202b36" transform="translate(286.6176 183.312775)">Length limits; operation asymmetry;</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #202b36" transform="translate(286.6176 193.950697)">error accumulation; value dependence</text>
   </g>
